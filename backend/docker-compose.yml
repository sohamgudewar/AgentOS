services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: agentos-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentos

    ports:
      - "5433:5432"

    volumes:
      - agentos_postgres_data:/var/lib/postgresql

volumes:
  agentos_postgres_data:
